# Refuses a push or pull request that carries a credential. Public repo: Actions minutes are free, so it runs on
# every push. The scanner is scripts/scan-secrets.sh; it names the file and line of a hit, never the text.
name: secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: the tree, and every commit since the base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=${PR_BASE:-$BEFORE}
          # A new branch's "before" is all zeros, and a force-push's may be a commit that is gone: scan the tree then.
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then scripts/scan-secrets.sh "$base"
          else scripts/scan-secrets.sh; fi
